<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 230px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #fbf1c7;
        color: #3c3836;
        margin: 0;
      }
      .header {
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 12px;
        color: #b57614;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        background-color: #ebdbb2;
        border: 1px solid #d5c4a1;
        color: #3c3836;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        background-color: #d5c4a1;
      }
      button.pdf-btn {
        background-color: #b57614;
        color: #fbf1c7;
        border: none;
      }
      button.pdf-btn:hover {
        background-color: #9d6708;
      }
    </style>
  </head>
  <body>
    <div class="header">📜 Chat-a-logue 📜</div>
    <button id="export-md">Export to Markdown</button>
    <button id="export-pdf" class="pdf-btn">Export to PDF</button>
    <script src="popup.js"></script>
  </body>
</html>
